<!--
  Sāmaveda Reader — सूक्ततानि
  ================
  Sibling reader to gana.html, for standalone sūkta hymns.
  Data lives at data/suktas.json: { texts: [ { title, verses: [string,...] }, ... ] }.
  Mirrors gana.html's design tokens, layout, and search-box.
-->
<!DOCTYPE html>
<html lang="sa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sāmaveda · सूक्ततानि</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1e6; --bg-soft: #efe7d5; --panel: #fbf7ec; --panel-2: #f1e9d8;
      --line: #ded0af; --line-soft: #e6dabd; --ember: #b35d2c; --ember-soft: #c98653;
      --gold: #9c6c2e; --ash: #6b5f4a; --ash-dim: #948566; --paper: #2a2013; --paper-dim: #40331f;
      --radius: 3px;
      --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      --serif: 'Fraunces', Georgia, serif;
      --deva: 'Noto Serif Devanagari', 'Noto Sans Devanagari', 'Nirmala UI', 'Mangal', 'Kokila', 'Utsaah', 'Aparajita', 'Lohit Devanagari', 'Arial Unicode MS', sans-serif, serif;
      --deva-sans: 'Noto Sans Devanagari', 'Noto Serif Devanagari', 'Nirmala UI', 'Mangal', 'Kohinoor Devanagari', 'Kokila', 'Utsaah', 'Aparajita', 'Lohit Devanagari', 'Arial Unicode MS', sans-serif;
    }
    html[data-theme="dark"] {
      --bg: #191510; --bg-soft: #211b14; --panel: #221c15; --panel-2: #2a2219;
      --line: #3c3225; --line-soft: #322a20; --ember: #e08a4f; --ember-soft: #c9713c;
      --gold: #d9ad5f; --ash: #c9bda3; --ash-dim: #8c8069; --paper: #f3ead9; --paper-dim: #ddd0b6;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: radial-gradient(circle at 15% 8%, rgba(179,93,44,.05), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(156,108,46,.05), transparent 45%);
      pointer-events: none; z-index: 0; transition: opacity .2s;
    }
    html[data-theme="dark"] body::before {
      background-image: radial-gradient(circle at 15% 8%, rgba(224,138,79,.08), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(217,173,95,.06), transparent 45%);
    }
    mark { background: var(--ember); color: var(--bg); padding: 0 1px; border-radius: 1px; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; }
    body {
      background: var(--bg); color: var(--paper-dim); font-family: var(--sans);
      overflow: hidden; overscroll-behavior: none; transition: background .2s, color .2s;
    }
    .app { display:flex; height:100vh; position:relative; z-index:1; }

    .sidebar {
      width: 280px; min-width: 280px; background: var(--panel);
      border-right: 1px solid var(--line); display:flex; flex-direction:column;
      transition: margin-left .28s cubic-bezier(.4,0,.2,1), background .2s, border-color .2s;
    }
    .sidebar.collapsed { margin-left: -280px; }
    .sidebar-head { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
    .brand { display:flex; align-items:baseline; gap:10px; text-decoration:none; cursor:pointer; }
    .brand-mark { font-family: var(--deva); font-size:26px; color: var(--ember); line-height:1; }
    .brand-text h1 { margin:0; font-family: var(--serif); font-weight:600; font-size:16.5px; color: var(--paper); }
    .brand-text p { margin:2px 0 0; font-size:11px; color: var(--ash-dim); }
    .sidebar-search { margin-top:14px; position:relative; }
    .sidebar-search input {
      width:100%; background: var(--bg-soft); border:1px solid var(--line); color: var(--paper-dim);
      font-family: var(--sans); font-size:13px; padding:8px 26px 8px 30px; border-radius: var(--radius);
      outline:none; transition: border-color .15s;
    }
    .sidebar-search input:focus { border-color: var(--ember-soft); }
    .sidebar-search input::placeholder { color: var(--ash-dim); }
    .sidebar-search svg.icn { position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke: var(--ash-dim); pointer-events:none; }

    .sidebar-tree { flex:1; overflow-y:auto; padding:10px 8px 20px; }
    .sidebar-tree::-webkit-scrollbar { width:8px; }
    .sidebar-tree::-webkit-scrollbar-thumb { background: var(--line); border-radius:4px; }
    .sukta-link {
      display:block; width:100%; text-align:left; background:none; border:none; color: var(--paper);
      font-family: var(--deva); font-size:15px; padding:10px 12px; cursor:pointer; border-radius: var(--radius);
    }
    .sukta-link .n { font-family: var(--sans); font-size:10px; color: var(--ash-dim); display:block; margin-bottom:2px; }
    .sukta-link:hover { background: var(--panel-2); }
    .sukta-link.current { background: rgba(179,93,44,.12); color: var(--ember); }
    .sidebar-foot { padding:10px 20px; border-top:1px solid var(--line); font-size:10.5px; color: var(--ash-dim); flex-shrink:0; }
    .sidebar-foot b { color: var(--gold); font-weight:600; }

    .main { flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; }
    .topbar {
      display:flex; align-items:center; justify-content:center; gap:14px; padding:12px 22px;
      border-bottom:1px solid var(--line); background: var(--bg-soft); flex-shrink:0; flex-wrap:wrap; position:relative;
    }
    .icon-btn {
      background:none; border:1px solid var(--line); color: var(--ash); width:32px; height:32px;
      border-radius: var(--radius); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
      transition: border-color .15s, color .15s;
    }
    .icon-btn:hover { border-color: var(--ember-soft); color: var(--ember); }
    .icon-btn svg { width:16px; height:16px; }
    .global-search { flex:1 1 280px; max-width:480px; position:relative; }
    .global-search input {
      width:100%; background: var(--panel); border:1px solid var(--line); color: var(--paper-dim);
      font-family: var(--sans); font-size:13.5px; padding:9px 34px 9px 34px; border-radius: var(--radius); outline:none;
      transition: border-color .15s;
    }
    .global-search input:focus { border-color: var(--ember-soft); }
    .global-search svg.icn { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke: var(--ash-dim); pointer-events:none; }
    .global-search .clear-btn { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--ash-dim); cursor:pointer; display:none; }
    .global-search .clear-btn.show { display:block; }
    .crumb { font-size:12px; color: var(--ash-dim); }
    .crumb b { color: var(--gold); }

    .content { flex:1; overflow-y:auto; padding:36px 0 90px; }
    .content-inner { max-width:760px; margin:0 auto; padding:0 30px; }
    .text-heading { margin-bottom: 26px; }
    .text-heading h2 { font-family: var(--serif); font-size:30px; font-weight:600; color: var(--paper); margin:0 0 6px; }
    .text-heading .stats { font-size:12px; color: var(--ash-dim); }
    .rule { height:1px; background: var(--line); margin:14px 0 22px; }

    .verse-card { padding: 22px 0; border-bottom:1px solid var(--line-soft); scroll-margin-top:100px; }
    .verse-card:last-child { border-bottom:none; }
    .verse-card.match-highlight { animation: pulseHi 1.6s ease; }
    @keyframes pulseHi { 0% { background: rgba(179,93,44,.14); } 100% { background: transparent; } }
    .verse-no-badge {
      font-family: var(--deva); font-size:12px; color: var(--bg); background: var(--ember);
      padding:2px 9px; border-radius:2px; font-weight:600; display:inline-block; margin-bottom:10px;
    }
    html[data-theme="dark"] .verse-no-badge { color:#191510; }
    .verse-text { font-family: var(--deva); font-size: calc(19px * var(--zoom,1)); line-height:2.1; color: var(--paper); overflow-wrap:break-word; word-break:break-word; }

    .search-results-note { font-size:12px; color: var(--ash-dim); margin:0 0 20px; }
    .search-results-note b { color: var(--gold); }
    .section-heading { margin-top:28px; }
    .section-heading h3 { font-family: var(--serif); font-size:16px; color: var(--paper); margin:0 0 6px; }

    .empty-state { text-align:center; padding:100px 20px; color: var(--ash-dim); }
    .empty-state svg { width:38px; height:38px; margin-bottom:14px; opacity:.5; }
    .empty-state p { font-size:13px; }
    .empty-state a { color: var(--ember); }

    .zoom-group { display:flex; align-items:center; border:1px solid var(--line); border-radius: var(--radius); overflow:hidden; }
    .zoom-group button { background:none; border:none; color: var(--ash); width:26px; height:28px; cursor:pointer; font-size:15px; }
    .zoom-group button:hover { color: var(--ember); }
    .zoom-val { font-size:10.5px; color: var(--ash-dim); padding:0 6px; font-variant-numeric: tabular-nums; }

    .icon-sun, .icon-moon { display:none; }
    html:not([data-theme="dark"]) .icon-sun { display:block; }
    html[data-theme="dark"] .icon-moon { display:block; }

    .jump-top {
      position:fixed; bottom:26px; right:30px; width:38px; height:38px; border-radius:50%;
      background: var(--panel); border:1px solid var(--line); color: var(--ash);
      display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; pointer-events:none;
      transition: opacity .2s, border-color .15s; z-index:5;
    }
    .jump-top.show { opacity:1; pointer-events:auto; }
    .jump-top:hover { border-color: var(--ember-soft); color: var(--ember); }
    .jump-top svg { width:16px; height:16px; }

    .sidebar-overlay { display:none; position:fixed; inset:0; background: rgba(0,0,0,.5); z-index:15; }
    .sidebar-overlay.show { display:block; }

    @media (max-width: 720px) {
      .sidebar { position:fixed; z-index:20; top:0; bottom:0; left:0; height:100dvh; width:86vw; max-width:320px; box-shadow:20px 0 40px rgba(0,0,0,.4); margin-left:0; transform: translateX(0); transition: transform .28s cubic-bezier(.4,0,.2,1); }
      .sidebar.collapsed { transform: translateX(-105%); }
      .crumb { display:none; }
      .content-inner { padding:0 16px; }
      .verse-text { font-size: calc(17px * var(--zoom,1)); line-height:1.95; }
      .text-heading h2 { font-size:24px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="index.html" title="Back to home">
        <div class="brand-mark">सू</div>
        <div class="brand-text">
          <h1>सूक्ततानि</h1>
          <p>Standalone hymns · Sāmaveda</p>
        </div>
      </a>
      <div class="sidebar-search">
        <svg class="icn" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        <input type="text" id="sidebarFilter" placeholder="Filter sūktas…">
      </div>
    </div>
    <nav class="sidebar-tree" id="sidebarTree"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="toggleSidebar" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <div class="global-search">
        <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        <input type="text" id="globalSearch" placeholder="Search sūktas & verses…">
        <button class="clear-btn" id="clearSearch" title="Clear">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="crumb" id="crumb"></div>
      <div class="zoom-group" title="Text size">
        <button id="zoomOut">−</button>
        <span class="zoom-val" id="zoomVal">100%</span>
        <button id="zoomIn">+</button>
      </div>
      <button class="icon-btn" id="themeToggle" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
    <div class="content" id="content">
      <div class="content-inner" id="contentInner"></div>
    </div>
  </main>
</div>
<button class="jump-top" id="jumpTop" title="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
</button>

<script>
  let currentTheme = 'light';
  function applyTheme(t){ currentTheme = t; document.documentElement.setAttribute('data-theme', t); }
  document.getElementById('themeToggle').addEventListener('click', () => applyTheme(currentTheme==='dark'?'light':'dark'));
  applyTheme('light');

  let DATA = [];       // [{title, verses:[string,...]}]
  let zoom = 1;
  const treeRoot = document.getElementById('sidebarTree');
  const contentInner = document.getElementById('contentInner');
  const contentEl = document.getElementById('content');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const globalSearch = document.getElementById('globalSearch');
  const clearSearch = document.getElementById('clearSearch');

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // Strip Vedic accent/svara marks so search matches on plain consonant/vowel text.
  function normalize(s){ return String(s).normalize('NFC').replace(/[꣡꣢꣣꣥꣯᳐᳒]/g,'').replace(/\s+/g,' ').trim(); }
  function splitTerms(q){ return normalize(q).toLowerCase().split(/\s+/).filter(Boolean); }
  function highlight(text, terms){
    if(!terms || !terms.length) return escapeHtml(text);
    let html = escapeHtml(text);
    for(const t of terms){
      if(!t) continue;
      const re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')', 'gi');
      html = html.replace(re, '<mark>$1</mark>');
    }
    return html;
  }

  function buildTree(){
    treeRoot.innerHTML = '';
    DATA.forEach((text, ti) => {
      const btn = document.createElement('button');
      btn.className = 'sukta-link';
      btn.dataset.ti = ti;
      btn.innerHTML = `<span class="n">${text.verses.length} ऋचः</span>${escapeHtml(text.title)}`;
      btn.addEventListener('click', () => scrollToText(ti));
      treeRoot.appendChild(btn);
    });
  }

  function highlightSidebar(ti){
    treeRoot.querySelectorAll('.sukta-link').forEach(el => el.classList.toggle('current', +el.dataset.ti === ti));
  }

  function renderVerse(text, ti, verse, vi, opts){
    const terms = (opts && opts.terms) || [];
    return `<div class="verse-card" data-ti="${ti}" data-vi="${vi}" id="v-${ti}-${vi}">
      <span class="verse-no-badge">ऋक् ${vi+1}</span>
      <div class="verse-text">${highlight(verse, terms)}</div>
    </div>`;
  }

  function renderAll(){
    let html = '';
    DATA.forEach((text, ti) => {
      html += `<div class="text-heading" data-ti="${ti}" id="t-${ti}">
        <h2>${escapeHtml(text.title)}</h2>
        <div class="stats">${text.verses.length} ऋचः</div>
        <div class="rule"></div>
      </div>`;
      text.verses.forEach((v, vi) => { html += renderVerse(text, ti, v, vi, {}); });
    });
    contentInner.innerHTML = html || `<div class="empty-state"><p>No sūktas found.</p></div>`;
  }

  function scrollToText(ti){
    if(globalSearch.value.trim()){ globalSearch.value=''; runGlobalSearch(''); }
    const el = document.getElementById('t-'+ti);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    highlightSidebar(ti);
    if(window.innerWidth <= 720) closeSidebar();
  }

  function runGlobalSearch(qRaw){
    const q = qRaw.trim();
    clearSearch.classList.toggle('show', !!q);
    if(!q){ renderAll(); document.getElementById('crumb').textContent=''; return; }
    const terms = splitTerms(q);
    if(!terms.length){ renderAll(); return; }
    const scored = [];
    DATA.forEach((text, ti) => {
      const titleNorm = normalize(text.title).toLowerCase();
      text.verses.forEach((v, vi) => {
        const norm = normalize(v).toLowerCase();
        let score = 0, ok = true;
        for(const t of terms){
          if(norm.includes(t)) score += 1;
          else if(titleNorm.includes(t)) score += 0.5;
          else { ok = false; break; }
        }
        if(ok) scored.push({ti, vi, score, text, verse:v});
      });
    });
    scored.sort((a,b) => b.score-a.score || a.ti-b.ti || a.vi-b.vi);
    let html = `<div class="search-results-note">Found <b>${scored.length}</b> matching verse${scored.length===1?'':'s'} for "<b>${escapeHtml(q)}</b>"</div>`;
    if(!scored.length){
      html += `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        <p>No verses match your search.</p></div>`;
    } else {
      let lastTi = -1;
      scored.slice(0,400).forEach(({ti, vi, text, verse}) => {
        if(ti !== lastTi){
          html += `<div class="section-heading"><h3>${escapeHtml(text.title)}</h3><div class="rule"></div></div>`;
          lastTi = ti;
        }
        html += renderVerse(text, ti, verse, vi, {terms});
      });
    }
    contentInner.innerHTML = html;
    document.getElementById('crumb').innerHTML = `Search: "<b>${escapeHtml(q)}</b>" · ${scored.length} result${scored.length===1?'':'s'}`;
  }

  let searchTimer;
  globalSearch.addEventListener('input', (e) => { clearTimeout(searchTimer); const val = e.target.value; searchTimer = setTimeout(()=>runGlobalSearch(val), 160); });
  clearSearch.addEventListener('click', () => { globalSearch.value=''; runGlobalSearch(''); globalSearch.focus(); });

  document.getElementById('sidebarFilter').addEventListener('input', (e) => {
    const q = normalize(e.target.value).toLowerCase();
    treeRoot.querySelectorAll('.sukta-link').forEach(btn => {
      const ti = +btn.dataset.ti;
      btn.style.display = normalize(DATA[ti].title).toLowerCase().includes(q) ? '' : 'none';
    });
  });

  function applyZoom(){ document.documentElement.style.setProperty('--zoom', zoom.toFixed(2)); document.getElementById('zoomVal').textContent = Math.round(zoom*100)+'%'; }
  document.getElementById('zoomIn').addEventListener('click', () => { zoom = Math.min(2, zoom+0.1); applyZoom(); });
  document.getElementById('zoomOut').addEventListener('click', () => { zoom = Math.max(0.6, zoom-0.1); applyZoom(); });

  function closeSidebar(){ sidebar.classList.add('collapsed'); overlay.classList.remove('show'); }
  function openSidebar(){ sidebar.classList.remove('collapsed'); if(window.innerWidth<=720) overlay.classList.add('show'); }
  document.getElementById('toggleSidebar').addEventListener('click', () => sidebar.classList.contains('collapsed') ? openSidebar() : closeSidebar());
  overlay.addEventListener('click', closeSidebar);

  const jumpTop = document.getElementById('jumpTop');
  contentEl.addEventListener('scroll', () => {
    jumpTop.classList.toggle('show', contentEl.scrollTop > 500);
    if(globalSearch.value.trim()) return;
    const headings = contentInner.querySelectorAll('.text-heading');
    let current = -1;
    headings.forEach(h => { if(h.getBoundingClientRect().top <= 140) current = +h.dataset.ti; });
    if(current >= 0){
      document.getElementById('crumb').innerHTML = `<b>${escapeHtml(DATA[current].title)}</b>`;
      highlightSidebar(current);
    }
  });
  jumpTop.addEventListener('click', () => contentEl.scrollTo({top:0, behavior:'smooth'}));

  async function init(){
    try{
      const res = await fetch('data/suktas.json', {cache:'no-cache'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      DATA = json.texts || [];
    }catch(err){
      contentInner.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p><b>Could not load suktas.json.</b><br>${escapeHtml(err.message)}<br><br>
        Make sure <code>data/suktas.json</code> sits in a <code>data/</code> folder next to this file
        and this page is served over http(s). <a href="index.html">← Back to home</a></p></div>`;
      return;
    }
    buildTree();
    renderAll();
    applyZoom();
    const totalVerses = DATA.reduce((a,t)=>a+t.verses.length,0);
    document.getElementById('sidebarFoot').innerHTML = `<b>${DATA.length}</b> sūktas · <b>${totalVerses}</b> ऋचः`;

    const params = new URLSearchParams(location.search);
    const q = params.get('q');
    if(q){ globalSearch.value = q; runGlobalSearch(q); }
  }
  contentInner.innerHTML = `<div class="empty-state"><p>Loading सूक्ततानि …</p></div>`;
  init();
</script>
</body>
</html>
