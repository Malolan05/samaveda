<!--
  Sāmaveda Reader — Grantha edition
  ==================================
  A single-file, static reader for the Sāmaveda saṁhitā, rendered in the
  Grantha script (identical data model/UI to prakritiganam.html, which
  renders the Devanagari edition).

  How it works:
    - This file contains ALL markup, styles, and behavior (no build step).
    - Verse data is NOT embedded here — it's fetched at runtime from
      "data/prakritaranyakagana-grantha.json" (see the `init()` function
      near the bottom of the <script>). That JSON must sit in a `data/`
      folder next to this index.html, and the page must be served over
      http(s) (opening via file:// blocks the fetch in most browsers).
    - The Sanskrit text in the source JSON is already in Grantha-script
      Unicode (U+11300 block), so no transliteration happens client-side —
      this file only swaps the display font stack to Grantha-capable
      fonts and widens the line spacing on the verse/pada blocks to a
      triple (3x) line-height, since Grantha's stacked conjuncts and
      vowel signs need more vertical room to stay legible.
    - The Grantha typeface itself (Noto Serif Grantha, regular weight)
      is embedded directly in this file as a base64 data: URI via an
      @font-face rule near the top of <style> — it is NOT fetched from
      Google Fonts or any other external host, so the Grantha glyphs
      render correctly even offline or with all outbound network
      requests blocked. Only the Latin/IAST "Noto Serif" webfont (used
      for UI chrome — buttons, labels, English text) still comes from
      Google Fonts; everything Grantha is self-contained.
    - The UI has three moving parts:
        1. A collapsible sidebar tree (text → section → r̥k) for navigation.
        2. A scrollable main content pane that renders every r̥k (verse)
           and its associated sāma-gāna(s) (sung versions).
        3. A topbar with a global fuzzy search, a text-zoom control,
           and a light/dark theme toggle.
    - Light/dark theme is implemented purely with CSS custom properties
      (see the `:root` and `html[data-theme="dark"]` blocks below) and a
      tiny bit of JS that flips the `data-theme` attribute on <html>.
-->

    html, body, body *, input, button, textarea, select { font-family: 'Noto Serif', 'Noto Serif Grantha Embedded', Georgia, serif; }
    /* ==========================================================
       DESIGN TOKENS (light theme / default)
       Every color in this stylesheet is a var(--token) reference,
       which is what makes the dark theme override below possible:
       we only need to redefine the tokens, not every rule that
       uses them.
       ========================================================== */
    :root {
      --bg: #f6f1e6;          /* page background */
      --bg-soft: #efe7d5;     /* slightly darker background (topbar) */
      --panel: #fbf7ec;       /* card / sidebar / input surfaces */
      --panel-2: #f1e9d8;     /* hover state for panel surfaces */
      --line: #ded0af;        /* primary borders / dividers */
      --line-soft: #e6dabd;   /* faint borders (nested tree lines) */
      --ember: #b35d2c;       /* primary accent (active states, links) */
      --ember-soft: #c98653;  /* secondary/hover accent */
      --gold: #9c6c2e;        /* secondary accent (labels, translit text) */
      --ash: #6b5f4a;         /* mid-tone body text */
      --ash-dim: #948566;     /* muted/placeholder text */
      --paper: #2a2013;       /* strongest text color (headings) */
      --paper-dim: #40331f;   /* body text color */
      --ok: #4f7a45;          /* reserved success/positive color (unused directly) */
      --radius: 3px;          /* shared corner radius for controls */

      /* Font stacks */
      --sans: 'Noto Serif', 'Noto Serif Grantha Embedded', Georgia, serif;
      --serif: 'Noto Serif', 'Noto Serif Grantha Embedded', Georgia, serif;
      /* Grantha serif stack, for the large Sanskrit verse text — this
         edition renders throughout in serif Grantha, so the fallbacks
         below are only a last-resort glyph-coverage backstop for the
         (unlikely) case the embedded face fails to parse. */
      --deva: 'Noto Serif Grantha Embedded', 'Siddhanta', 'Grantha Sangam MN',
              'Adobe Grantha', 'Arial Unicode MS', 'Segoe UI Historic', serif;
      /* Secondary Grantha stack (pada, meta) — still serif-first, same
         family as --deva, so the whole reader stays serif-uniform. */
      --deva-sans: 'Noto Serif Grantha Embedded', 'Grantha Sangam MN',
              'Adobe Grantha', 'Arial Unicode MS', serif;
    }

    /* ==========================================================
       DARK THEME OVERRIDE
       Activated by JS setting <html data-theme="dark">. Only the
       tokens change here — every component below inherits the new
       colors automatically because they all reference var(--token).
       ========================================================== */
    html[data-theme="dark"] {
      --bg: #191510;
      --bg-soft: #211b14;
      --panel: #221c15;
      --panel-2: #2a2219;
      --line: #3c3225;
      --line-soft: #322a20;
      --ember: #e08a4f;
      --ember-soft: #c9713c;
      --gold: #d9ad5f;
      --ash: #c9bda3;
      --ash-dim: #8c8069;
      --paper: #f3ead9;
      --paper-dim: #ddd0b6;
      --ok: #7fae72;
    }

    /* Soft ambient radial-gradient glow behind the whole page.
       Kept as a pseudo-element so it never interferes with content
       layout/scrolling (pointer-events: none, negative z-index). */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 15% 8%, rgba(179,93,44,.05), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(156,108,46,.05), transparent 45%);
      pointer-events: none;
      z-index: 0;
      transition: opacity .2s;
    }
    /* Dark mode gets a brighter/warmer glow so the page doesn't feel flat */
    html[data-theme="dark"] body::before {
      background-image:
        radial-gradient(circle at 15% 8%, rgba(224,138,79,.08), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(217,173,95,.06), transparent 45%);
    }
    /* These two elements use a solid --ember/--ember background with
       light text on top. Since --ember flips to a lighter/brighter
       color in dark mode, the text color must flip too (dark-on-light)
       to keep sufficient contrast — that's what these overrides do. */
    .rik-no-badge { color: #fbf7ec; }
    html[data-theme="dark"] .rik-no-badge { color: #191510; }
    mark { color: #fbf7ec; }
    html[data-theme="dark"] mark { color: #191510; }

    /* ---------- base reset ---------- */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--paper-dim);
      font-family: var(--sans);
      overflow: hidden;              /* the app scrolls internally (see .content), not the body */
      overscroll-behavior: none;     /* stop pull-to-refresh / rubber-banding on mobile */
      transition: background .2s, color .2s; /* smooth cross-fade when the theme is toggled */
    }
    img, svg { max-width: 100%; }
    .content, .sidebar-tree { -webkit-overflow-scrolling: touch; } /* momentum scroll on iOS */

    /* ---------- layout: two-pane app shell (sidebar + main) ---------- */
    .app {
      display: flex;
      height: 100vh;
      position: relative;
      z-index: 1;   /* sits above the fixed body::before glow */
    }

    /* ---------- sidebar: navigation tree (texts → sections → r̥ks) ---------- */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      transition: margin-left .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1), background .2s, border-color .2s;
      position: relative;
    }
    /* Collapsing the sidebar just slides it fully off-screen via negative
       margin, rather than unmounting it — keeps its scroll position and
       open/closed tree state intact when it's reopened. */
    .sidebar.collapsed { margin-left: -300px; }
    .sidebar-head {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .brand-mark {
      font-family: var(--deva);
      font-size: 26px;
      color: var(--ember);
      line-height: 1;
    }
    .brand-text h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 16.5px;
      letter-spacing: .2px;
      color: var(--paper);
    }
    .brand-text p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--ash-dim);
    }
    .sidebar-search {
      margin-top: 14px;
      position: relative;
    }
    .sidebar-search input {
      width: 100%;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      color: var(--paper-dim);
      font-family: var(--sans);
      font-size: 13px;
      padding: 8px 10px 8px 30px;
      border-radius: var(--radius);
      outline: none;
      transition: border-color .15s;
    }
    .sidebar-search input:focus { border-color: var(--ember-soft); }
    .sidebar-search input::placeholder { color: var(--ash-dim); }
    .sidebar-search input { padding-right: 26px; }
    .sidebar-search svg.icn {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; stroke: var(--ash-dim);
      pointer-events: none;
    }
    .sidebar-search .sf-clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--ash-dim);
      cursor: pointer; padding: 2px; display: none; line-height: 0;
    }
    .sidebar-search .sf-clear.show { display: block; }
    .sidebar-search .sf-clear:hover { color: var(--ember); }
    .sidebar-search .sf-clear svg { width: 12px; height: 12px; }

    .sidebar-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .sidebar-actions button {
      flex: 1;
      background: none;
      border: 1px solid var(--line);
      color: var(--ash);
      font-family: var(--sans);
      font-size: 10.5px;
      font-weight: 500;
      padding: 5px 6px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .sidebar-actions button:hover { border-color: var(--ember-soft); color: var(--ember); }

    .sidebar-tree {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 20px;
    }
    .sidebar-tree::-webkit-scrollbar { width: 8px; }
    .sidebar-tree::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    .sidebar-tree::-webkit-scrollbar-track { background: transparent; }
    .sidebar-empty {
      padding: 20px 10px;
      font-size: 12px;
      color: var(--ash-dim);
      text-align: center;
      line-height: 1.5;
    }
    .sidebar-foot {
      padding: 10px 20px;
      border-top: 1px solid var(--line);
      font-size: 10.5px;
      color: var(--ash-dim);
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-foot b { color: var(--gold); font-weight: 600; }

    .text-group { margin-bottom: 2px; }
    .text-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      background: none;
      border: none;
      color: var(--paper);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 8px;
      cursor: pointer;
      border-radius: var(--radius);
      text-align: left;
    }
    .text-toggle:hover { background: var(--panel-2); }
    .text-toggle .chev {
      width: 9px; height: 9px;
      flex-shrink: 0;
      transition: transform .18s;
      color: var(--ash-dim);
    }
    .text-toggle .idx {
      font-family: var(--deva);
      font-size: 15px;
      color: var(--ember);
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }
    .text-toggle.active-text { color: var(--ember); }
    .text-toggle.active-text .idx { color: var(--gold); }
    .text-toggle span.label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .text-toggle .count {
      font-size: 10px;
      color: var(--ash-dim);
      font-variant-numeric: tabular-nums;
    }
    .text-group.open > .text-toggle .chev { transform: rotate(90deg); }

    .section-list {
      max-height: 0;
      overflow: hidden;
      padding-left: 14px;
      border-left: 1px solid var(--line-soft);
      margin-left: 16px;
    }
    .text-group.open > .section-list { max-height: none; }

    .section-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      background: none;
      border: none;
      color: var(--ash);
      font-family: var(--sans);
      font-size: 12px;
      padding: 7px 8px;
      cursor: pointer;
      border-radius: var(--radius);
      text-align: left;
    }
    .section-toggle:hover { background: var(--panel-2); color: var(--paper-dim); }
    .section-toggle .chev { width:7px; height:7px; color:var(--ash-dim); transition:transform .15s; flex-shrink:0; }
    .section-item.open > .section-toggle .chev { transform: rotate(90deg); }
    .section-toggle span.label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .section-toggle .count { font-size:10px; color:var(--ash-dim); }
    .section-item.active-section > .section-toggle { color: var(--ember); background: rgba(179,93,44,.08); }
    .section-item.active-section > .section-toggle .count { color: var(--ember-soft); }

    .rik-list {
      max-height: 0;
      overflow: hidden;
      padding-left: 12px;
      margin-left: 10px;
      border-left: 1px solid var(--line-soft);
    }
    .section-item.open > .rik-list { max-height: none; }
    .rik-link {
      display: block;
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      color: var(--ash-dim);
      font-size: 11.5px;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: var(--radius);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rik-link:hover { background: var(--panel-2); color: var(--paper-dim); }
    .rik-link.current { background: rgba(179,93,44,.12); color: var(--ember); }

    /* ---------- main ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
    }

    /* ---------- topbar: sidebar toggle, search, zoom, theme toggle ----------
       Everything is centered as a single flex row that wraps on narrow
       screens (see the max-width:720px media query further down). */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-soft);
      flex-shrink: 0;
      flex-wrap: wrap;
      position: relative;
      transition: background .2s, border-color .2s;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--line);
      color: var(--ash);
      width: 32px; height: 32px;
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color .15s, color .15s;
    }
    .icon-btn:hover { border-color: var(--ember-soft); color: var(--ember); }
    .icon-btn svg { width: 16px; height: 16px; }

    .global-search {
      flex: 1 1 280px;
      max-width: 480px;
      position: relative;
    }
    .global-search input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--paper-dim);
      font-size: 13.5px;
      padding: 9px 34px 9px 34px;
      border-radius: var(--radius);
      outline: none;
    }
    .global-search input:focus { border-color: var(--ember-soft); }
    .global-search svg.icn {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; stroke: var(--ash-dim);
    }
    .global-search .clear-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--ash-dim);
      cursor: pointer; display: none; padding: 2px;
    }
    .global-search .clear-btn.show { display: block; }

    .zoom-group {
      display: flex;
      align-items: center;
      gap: 2px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 2px;
      flex-shrink: 0;
    }
    .zoom-group button {
      background: none; border: none; color: var(--ash);
      width: 28px; height: 26px;
      cursor: pointer;
      border-radius: 2px;
      font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }
    .zoom-group button:hover { background: var(--panel-2); color: var(--ember); }
    .zoom-group .zoom-val {
      font-size: 10.5px;
      color: var(--ash-dim);
      width: 34px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .crumb {
      font-size: 11.5px;
      color: var(--ash-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
    }
    @media (min-width: 920px) { .crumb { display: block; } }
    .crumb b { color: var(--gold); font-weight: 500; }

    /* ---------- theme toggle button ----------
       Both a sun and a moon SVG are always in the DOM, stacked on top
       of each other via position:absolute. We simply fade + rotate
       between them based on the current `data-theme` attribute — no
       JS is needed to swap icon markup, only to flip the attribute. */
    #themeToggle {
      display: flex !important;
      position: relative;   /* anchor for the two absolutely-positioned icons */
    }
    #themeToggle .icon-sun, #themeToggle .icon-moon {
      position: absolute;
      transition: opacity .15s, transform .25s;
    }
    /* Dark mode: show moon, hide sun (rotated + shrunk out) */
    html[data-theme="dark"] #themeToggle .icon-sun { opacity: 0; transform: rotate(-60deg) scale(.6); }
    html[data-theme="dark"] #themeToggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
    /* Light mode (default / explicit): show sun, hide moon */
    html[data-theme="light"] #themeToggle .icon-sun,
    html:not([data-theme]) #themeToggle .icon-sun { opacity: 1; transform: rotate(0) scale(1); }
    html[data-theme="light"] #themeToggle .icon-moon,
    html:not([data-theme]) #themeToggle .icon-moon { opacity: 0; transform: rotate(60deg) scale(.6); }

    /* ---------- main content pane ----------
       This is the single scrollable region for the whole app (the
       body itself doesn't scroll). Its scroll position drives the
       "scroll spy" logic in JS that updates the breadcrumb and
       highlights the current r̥k in the sidebar. */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 34px 0 80px;
      scroll-behavior: smooth;
    }
    .content::-webkit-scrollbar { width: 10px; }
    .content::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
    .content::-webkit-scrollbar-track { background: transparent; }

    .content-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 34px;
    }

    .text-heading {
      margin: 6px 0 6px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .text-heading .lbl {
      font-size: 11px;
      letter-spacing: .06em;
      color: var(--ember-soft);
      margin-bottom: 6px;
    }
    .text-heading h2 {
      font-family: var(--deva);
      font-size: 34px;
      font-weight: 600;
      color: var(--paper);
      margin: 0 0 4px;
    }
    .text-heading .translit {
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--gold);
      margin: 0 0 10px;
    }
    .text-heading .desc {
      font-size: 13px;
      line-height: 1.6;
      color: var(--ash);
      max-width: 640px;
      margin: 0 0 12px;
    }
    .text-heading .stats {
      display: flex; gap: 18px;
      font-size: 11px;
      color: var(--ash-dim);
    }
    .text-heading .stats b { color: var(--gold); font-weight: 600; }

    .section-heading {
      margin: 44px 0 18px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .section-heading h3 {
      font-family: var(--serif);
      font-weight: 500;
      font-style: italic;
      font-size: 18px;
      color: var(--gold);
      margin: 0;
      white-space: nowrap;
    }
    .section-heading .sub {
      font-family: var(--sans);
      font-size: 11px;
      color: var(--ash-dim);
      white-space: nowrap;
    }
    .section-heading .rule {
      flex: 1;
      min-width: 24px;
      height: 1px;
      background: linear-gradient(to right, var(--line), transparent);
    }

    /* One .rik-card = one verse (r̥k), including its Sanskrit text,
       pada-pāṭha (word-split text), notes, and any sāma-gāna(s). */
    .rik-card {
      scroll-margin-top: 20px;  /* keeps the card clear of the sticky topbar when scrolled to */
      padding: 22px 0;
      border-bottom: 1px solid var(--line-soft);
    }
    .rik-card:last-child { border-bottom: none; }
    /* Brief flash applied when a card is jumped to via search/sidebar click,
       so the user's eye finds it immediately (see scrollToRik() in JS). */
    .rik-card.match-highlight {
      animation: pulseHi 1.6s ease;
    }
    @keyframes pulseHi {
      0% { background: rgba(179,93,44,.14); }
      100% { background: transparent; }
    }

    .rik-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      margin-bottom: 10px;
    }
    .rik-tag {
      font-size: 10.5px;
      color: var(--ash-dim);
      display: flex; align-items: center; gap: 5px;
    }
    .rik-tag b { color: var(--ash); font-weight: 500; }
    .rik-no-badge {
      font-family: var(--deva);
      font-size: 12px;
      color: var(--bg);
      background: var(--ember);
      padding: 2px 9px;
      border-radius: 2px;
      font-weight: 600;
    }
    .global-badge {
      font-family: 'Inter', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--gold);
      background: transparent;
      border: 1px solid var(--line);
      padding: 2px 7px;
      border-radius: 2px;
      white-space: nowrap;
    }
    .global-badge.sg-global {
      color: var(--ember);
      border-color: var(--ember-soft);
      font-size: 9.5px;
      padding: 1px 6px;
    }

    .samhita-block {
      font-family: var(--deva);
      font-size: calc(19px * var(--zoom, 1));
      line-height: 3;
      color: var(--paper);
      margin-bottom: 8px;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .pada-block {
      font-family: var(--deva-sans);
      font-size: calc(13.5px * var(--zoom, 1));
      line-height: 3;
      color: var(--ash);
      margin-bottom: 16px;
      padding-left: 14px;
      border-left: 2px solid var(--line);
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .rik-notes {
      font-size: 11.5px;
      color: var(--ash-dim);
      font-style: italic;
      margin: 6px 0 16px;
    }

    /* A r̥k can have one or more sāma-gānas (sung melodic versions).
       They're rendered as a small stack of cards beneath the verse. */
    .samagana-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .samagana-item {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      transition: opacity .15s, border-color .15s, background .2s;
    }
    /* During a global search, if a specific sāma-gāna (not just its
       parent r̥k) matched the query, it's outlined... */
    .samagana-item.sg-match {
      border-color: var(--ember-soft);
      box-shadow: 0 0 0 1px rgba(179,93,44,.15) inset;
    }
    /* ...and its siblings that did NOT match are dimmed, to draw the
       eye to the specific match within a r̥k that has several sāmans. */
    .samagana-item.sg-dim { opacity: .45; }
    .samagana-item-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      margin-bottom: 8px;
    }
    .samagana-item-head .sg-no {
      font-family: var(--deva);
      font-size: 12px;
      color: var(--ember);
      border: 1px solid var(--ember-soft);
      border-radius: 50%;
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .samagana-item-head .sg-meta {
      font-size: 10.5px;
      color: var(--ash-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 60px;
    }
    .samagana-text {
      font-family: var(--deva);
      font-size: calc(17px * var(--zoom, 1));
      line-height: 3;
      color: var(--paper-dim);
      word-break: break-word;
    }
    .samagana-notes {
      margin-top: 8px;
      font-size: 11px;
      color: var(--ash-dim);
      font-style: italic;
    }

    mark {
      background: var(--ember);
      color: var(--bg);
      padding: 0 1px;
      border-radius: 1px;
    }

    .empty-state {
      text-align: center;
      padding: 100px 20px;
      color: var(--ash-dim);
    }
    .empty-state svg { width: 38px; height: 38px; margin-bottom: 14px; opacity: .5; }
    .empty-state p { font-size: 13px; }

    .search-results-note {
      font-size: 12px;
      color: var(--ash-dim);
      margin: 0 0 20px;
    }
    .search-results-note b { color: var(--gold); }

    .jump-top {
      position: fixed;
      bottom: 26px; right: 30px;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ash);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, border-color .15s;
      z-index: 5;
    }
    .jump-top.show { opacity: 1; pointer-events: auto; }
    .jump-top:hover { border-color: var(--ember-soft); color: var(--ember); }
    .jump-top svg { width: 16px; height: 16px; }

    /* Dark scrim shown behind the sidebar on mobile when it's open as
       an overlay drawer (see .sidebar's position:fixed rule below the
       720px breakpoint). Tapping it closes the sidebar. */
    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 15;
    }
    .sidebar-overlay.show { display: block; }

    /* ---------------- mobile / touch breakpoint ----------------
       Below 720px the sidebar switches from "pushes content over"
       to "fixed overlay drawer", and several paddings/sizes shrink
       for small screens. */
    @media (max-width: 720px) {
      .sidebar {
        position: fixed; z-index: 20; top: 0; bottom: 0; left: 0;
        height: 100vh; height: 100dvh;
        width: 86vw; min-width: 0; max-width: 340px;
        box-shadow: 20px 0 40px rgba(0,0,0,.4);
        margin-left: 0;
        transform: translateX(0);
        transition: transform .28s cubic-bezier(.4,0,.2,1);
      }
      .sidebar.collapsed { margin-left: 0; transform: translateX(-105%); }
      .crumb { display: none; }
      .content-inner { padding: 0 16px; }
      .text-heading h2 { font-size: 24px; }
      .text-heading .stats { flex-wrap: wrap; row-gap: 6px; }

      .topbar {
        padding: 10px 12px;
        gap: 8px;
        padding-top: max(10px, env(safe-area-inset-top));
        justify-content: center;
      }
      .global-search input { padding: 9px 30px 9px 30px; font-size: 13px; }
      .icon-btn { width: 38px; height: 38px; }
      .zoom-group { padding: 1px; }
      .zoom-group button { width: 30px; height: 30px; }
      .zoom-val { display: none; }

      .content { padding: 22px 0 90px; }
      .rik-card { padding: 18px 0; }
      .rik-meta { gap: 6px 10px; }
      .rik-tag { font-size: 10px; }
      .samhita-block { font-size: calc(17px * var(--zoom, 1)); line-height: 3; }
      .pada-block { font-size: calc(12.5px * var(--zoom, 1)); padding-left: 10px; }
      .samagana-item { padding: 12px 14px; }
      .samagana-text { font-size: calc(15.5px * var(--zoom, 1)); line-height: 3; }
      .samagana-item-head { flex-wrap: wrap; gap: 6px; }
      .samagana-item-head .sg-meta { white-space: normal; }

      .section-heading { margin: 32px 0 14px; }
      .section-heading h3 { font-size: 16px; white-space: normal; }

      .jump-top { bottom: calc(18px + env(safe-area-inset-bottom)); right: 18px; width: 42px; height: 42px; }
    }

    /* Extra-small phones: shrink a bit further still. */
    @media (max-width: 420px) {
      .sidebar { width: 88vw; max-width: none; }
      .brand-mark { font-size: 22px; }
      .brand-text h1 { font-size: 14.5px; }
      .text-heading h2 { font-size: 21px; }
      .samhita-block { font-size: calc(16px * var(--zoom, 1)); }
      .samagana-text { font-size: calc(14.5px * var(--zoom, 1)); }
      .content-inner { padding: 0 13px; }
    }

    @supports (padding: max(0px)) {
      .sidebar-head { padding-top: max(22px, env(safe-area-inset-top)); }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="sidebar-overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="index.html" title="Back to home">
        <div class="brand-mark">𑌸𑌾𑌮</div>
        <div class="brand-text">
          <h1>Sāmaveda</h1>
          <p>Five saṁhitā sections · 𑌗𑌾𑌨𑌂 (Grantha)</p>
        </div>
      </a>
      <div class="sidebar-search">
        <svg class="icn" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        <input type="text" id="sidebarFilter" placeholder="Filter sections & r̥ks…">
        <button class="sf-clear" id="sidebarFilterClear" title="Clear filter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="sidebar-actions">
        <button id="expandAll">Expand all</button>
        <button id="collapseAll">Collapse all</button>
      </div>
    </div>
    <nav class="sidebar-tree" id="sidebarTree"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <main class="main">
    <!-- TOPBAR -->
    <div class="topbar">
      <button class="icon-btn" id="toggleSidebar" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>

      <div class="global-search">
        <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        <input type="text" id="globalSearch" placeholder="Search verses, rishi, devatā, chandas, ref no…">
        <button class="clear-btn" id="clearSearch" title="Clear">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="crumb" id="crumb"></div>

      <div class="zoom-group" title="Text size">
        <button id="zoomOut">−</button>
        <span class="zoom-val" id="zoomVal">100%</span>
        <button id="zoomIn">+</button>
      </div>

      <button class="icon-btn" id="themeToggle" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>

    <div class="content" id="content">
      <div class="content-inner" id="contentInner"></div>
    </div>
  </main>
</div>

<button class="jump-top" id="jumpTop" title="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
</button>

<script>
  /* ============================================================
     THEME (light / dark)
     Toggling theme is intentionally trivial: we just flip the
     `data-theme` attribute on <html>, and every color in the CSS
     re-resolves automatically because the stylesheet is built
     entirely on custom-property tokens (see :root and
     html[data-theme="dark"] in <style>).
     Deliberately kept in memory only (no localStorage) — the app
     always starts in light mode on a fresh load.
     ============================================================ */
  let currentTheme = 'light';
  function applyTheme(t){
    currentTheme = t;
    document.documentElement.setAttribute('data-theme', t);
  }
  document.getElementById('themeToggle').addEventListener('click', () => {
    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
  });
  applyTheme('light'); // set the attribute explicitly on load so the CSS selectors have something to match

  /* ============================================================
     GLOBAL STATE
     DATA holds the entire Sāmaveda dataset once fetched (see
     init() near the bottom). Everything else in this file reads
     from DATA rather than fetching per-view.
     ============================================================ */
  let DATA = [];
  let TOTAL_RIKS = 0;    // total verse count across all texts, used for "R̥k №N of TOTAL" badges
  let TOTAL_SAMANS = 0;  // total sāma-gāna count across all texts, used for the matching badge

  // Human-readable metadata (transliteration + a one-glyph sidebar index)
  // for each of the five top-level texts, keyed by the `key` field the
  // JSON data uses to identify each one.
  const TEXT_META = {
    agneyam:   { translit: "Āgnēyam",           idx:"अ" },
    aindram:   { translit: "Aindram",           idx:"ऐ" },
    pavamanam: { translit: "Pavamānam",         idx:"प" },
    aranyaka:  { translit: "Āraṇyaka Gānam",    idx:"आ" },
    mahamnaya: { translit: "Mahānāmnyarcikam",  idx:"म" },
  };

  let zoom = 1;            // multiplier applied to Sanskrit text sizes via the --zoom CSS var
  let currentRikEl = null; // (reserved) currently-focused r̥k element

  /* ============================================================
     SIDEBAR TREE
     Builds the collapsible text → section → r̥k navigation tree
     once, from DATA, after it's loaded. Each level is a button
     that toggles an "open" class (CSS handles the expand/collapse
     animation via max-height) and scrolls the main content pane
     to the corresponding element.
     ============================================================ */
  const treeRoot = document.getElementById('sidebarTree');

  function buildTree(){
    treeRoot.innerHTML = '';
    // Level 1: one "text-group" per top-level text (e.g. Āgnēyam, Aindram...)
    DATA.forEach((text, ti) => {
      const meta = TEXT_META[text.key] || {translit:text.title, idx:'?'};
      const nRiks = text.sections.reduce((a,s)=>a+s.riks.length,0);
      const group = document.createElement('div');
      group.className = 'text-group';
      group.dataset.textIdx = ti;

      const toggle = document.createElement('button');
      toggle.className = 'text-toggle';
      toggle.innerHTML = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="9 6 15 12 9 18"/></svg>
        <span class="idx">${meta.idx}</span>
        <span class="label">${meta.translit}</span>
        <span class="count">${nRiks}</span>`;
      toggle.addEventListener('click', () => {
        const wasOpen = group.classList.contains('open');
        group.classList.toggle('open');
        if(!wasOpen){ scrollToText(ti); }
      });
      group.appendChild(toggle);

      const sectionList = document.createElement('div');
      sectionList.className = 'section-list';

      // Level 2: one "section-item" per section within this text
      text.sections.forEach((sec, si) => {
        const secItem = document.createElement('div');
        secItem.className = 'section-item';
        secItem.dataset.textIdx = ti;
        secItem.dataset.secIdx = si;

        const secToggle = document.createElement('button');
        secToggle.className = 'section-toggle';
        const secLabelFull = sec.sub ? `${sec.label} (${sec.sub})` : sec.label;
        secToggle.title = secLabelFull;
        secToggle.innerHTML = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="9 6 15 12 9 18"/></svg>
          <span class="label">${sec.label}</span>
          <span class="count">${sec.riks.length}</span>`;
        secToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const wasOpen = secItem.classList.contains('open');
          secItem.classList.toggle('open');
          if(!wasOpen){ scrollToSection(ti, si); }
        });
        secItem.appendChild(secToggle);

        const rikList = document.createElement('div');
        rikList.className = 'rik-list';
        // Level 3: one clickable link per individual r̥k (verse) in this section
        sec.riks.forEach((r, ri) => {
          const rikBtn = document.createElement('button');
          rikBtn.className = 'rik-link';
          rikBtn.dataset.textIdx = ti;
          rikBtn.dataset.secIdx = si;
          rikBtn.dataset.rikIdx = ri;
          const label = r.rik_no ? `R̥k ${r.rik_no}` : (r.ref || `#${ri+1}`);
          rikBtn.textContent = label + (r.devata ? ` — ${r.devata}` : '');
          rikBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            scrollToRik(ti, si, ri);
            if(window.innerWidth <= 720) closeSidebarMobile();
          });
          rikList.appendChild(rikBtn);
        });
        secItem.appendChild(rikList);
        sectionList.appendChild(secItem);
      });

      group.appendChild(sectionList);
      treeRoot.appendChild(group);
    });
  }

  /* ============================================================
     CONTENT RENDERING
     Everything in the main pane is built as HTML strings and
     assigned via innerHTML in one shot per render (renderAll /
     runGlobalSearch), rather than incrementally with the DOM API.
     This is simpler here since the content is regenerated wholesale
     on every search or theme-independent state change.
     ============================================================ */
  const contentInner = document.getElementById('contentInner');

  // Minimal HTML-escaping for any raw text interpolated into the
  // template strings below, to avoid XSS/broken markup from the data.
  function escapeHtml(s){
    return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // Renders the small row of metadata tags (prapāṭhaka, r̥ṣi, chandas,
  // devatā, etc.) shown above a r̥k's text. `terms`, if given (during a
  // search), causes matching substrings to be wrapped in <mark>.
  function renderRikMeta(r, terms){
    const hl = (s) => terms ? highlightMatches(s, terms) : escapeHtml(s);
    const tags = [];
    if(r.prapathaka) tags.push(`<span class="rik-tag">Prapāṭhaka: <b>${hl(r.prapathaka)}</b></span>`);
    if(r.ardha) tags.push(`<span class="rik-tag">Ardha: <b>${hl(r.ardha)}</b></span>`);
    if(r.khanda) tags.push(`<span class="rik-tag">Khaṇḍa: <b>${hl(r.khanda)}</b></span>`);
    if(r.rishi) tags.push(`<span class="rik-tag">R̥ṣi: <b>${hl(r.rishi)}</b></span>`);
    if(r.chandas) tags.push(`<span class="rik-tag">Chandas: <b>${hl(r.chandas)}</b></span>`);
    if(r.devata) tags.push(`<span class="rik-tag">Devatā: <b>${hl(r.devata)}</b></span>`);
    if(r.ref) tags.push(`<span class="rik-tag">${hl(r.ref)}</span>`);
    return tags.join('');
  }

  // Renders a single r̥k (verse) card: its samhitā text, pada-pāṭha,
  // notes, and any attached sāma-gāna(s).
  //   text/ti/si/r/ri  — the verse's location within DATA (text, section, rik indices + the rik object itself)
  //   searchOpts       — optional { terms, matchedSamaganaIdx } used only when rendering search results,
  //                       to highlight matched text and mark/dim individual sāma-gānas
  function renderRik(text, ti, si, r, ri, searchOpts){
    const terms = searchOpts && searchOpts.terms;
    const matchedIdx = (searchOpts && searchOpts.matchedSamaganaIdx) || null;
    const hl = (s) => terms ? highlightMatches(s, terms) : escapeHtml(s);
    const badge = r.rik_no ? `R̥k ${escapeHtml(String(r.rik_no))}` : '';
    let html = `<div class="rik-card" id="rik-${ti}-${si}-${ri}" data-text="${ti}" data-sec="${si}" data-rik="${ri}">`;
    html += `<div class="rik-meta">`;
    if(badge) html += `<span class="rik-no-badge">${badge}</span>`;
    if(r.global_no) html += `<span class="global-badge" title="R̥k #${r.global_no} of ${TOTAL_RIKS} across all five texts">R̥k №${r.global_no}</span>`;
    html += renderRikMeta(r, terms);
    html += `</div>`;
    if(r.samhita){
      html += `<div class="samhita-block">${hl(r.samhita)}</div>`;
    }
    if(r.pada){
      html += `<div class="pada-block">${hl(r.pada)}</div>`;
    }
    if(r.notes){
      html += `<div class="rik-notes">${hl(r.notes)}</div>`;
    }
    if(r.samaganas && r.samaganas.length){
      html += `<div class="samagana-list">`;
      r.samaganas.forEach((sg, idx) => {
        const isMatch = matchedIdx ? matchedIdx.has(idx) : false;
        const dim = matchedIdx && matchedIdx.size > 0 && !isMatch;
        const cls = 'samagana-item' + (isMatch ? ' sg-match' : '') + (dim ? ' sg-dim' : '');
        html += `<div class="${cls}">
          <div class="samagana-item-head">
            <span class="sg-no">${escapeHtml(String(sg.no||''))}</span>
            ${sg.global_no ? `<span class="global-badge sg-global" title="Sāman #${sg.global_no} of ${TOTAL_SAMANS} across all five texts">Sāman №${sg.global_no}</span>` : ''}
            <span class="sg-meta">${[sg.rishi,sg.chandas,sg.devata].filter(Boolean).map(v=>hl(v)).join(' · ')}${sg.ref?` · ${hl(sg.ref)}`:''}</span>
          </div>
          <div class="samagana-text">${hl(sg.text)}</div>
          ${sg.notes ? `<div class="samagana-notes">${hl(sg.notes)}</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
    return html;
  }

  // Renders the entire dataset (all texts, sections, and r̥ks) into
  // the main content pane. This is the "no active search" view, and
  // is also what's re-rendered when a search is cleared.
  function renderAll(){
    let html = '';
    DATA.forEach((text, ti) => {
      const meta = TEXT_META[text.key] || {translit:text.title, idx:'?'};
      const nRiks = text.sections.reduce((a,s)=>a+s.riks.length,0);
      const nSg = text.sections.reduce((a,s)=>a+s.riks.reduce((b,r)=>b+r.samaganas.length,0),0);
      html += `<section class="text-section" id="text-${ti}" data-text="${ti}">`;
      html += `<div class="text-heading">
        <div class="lbl">SĀMAVEDA · SECTION ${ti+1} OF ${DATA.length}</div>
        <h2>${escapeHtml(text.title)}</h2>
        <p class="translit">${escapeHtml(meta.translit)}</p>
        <p class="desc">${escapeHtml(text.desc||'')}</p>
        <div class="stats"><span><b>${text.sections.length}</b> sections</span><span><b>${nRiks}</b> r̥ks</span><span><b>${nSg}</b> sāma-gānas</span></div>
      </div>`;

      text.sections.forEach((sec, si) => {
        html += `<div class="section-heading" id="sec-${ti}-${si}" data-text="${ti}" data-sec="${si}"><h3>${escapeHtml(sec.label)}</h3>${sec.sub?`<span class="sub">${escapeHtml(sec.sub)}</span>`:''}<div class="rule"></div></div>`;
        sec.riks.forEach((r, ri) => {
          html += renderRik(text, ti, si, r, ri);
        });
      });

      html += `</section>`;
    });
    contentInner.innerHTML = html;
  }

  /* ============================================================
     SCROLL NAVIGATION
     Simple wrappers around scrollIntoView, used by the sidebar tree
     buttons and by search-result clicks to jump the content pane
     to a given text / section / r̥k.
     ============================================================ */
  const contentEl = document.getElementById('content');

  function scrollToText(ti){
    const el = document.getElementById(`text-${ti}`);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }
  function scrollToSection(ti, si){
    const el = document.getElementById(`sec-${ti}-${si}`);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }
  // Scrolls to a specific r̥k card and re-triggers its pulse-highlight
  // animation (removing then re-adding the class forces the CSS
  // animation to restart even if it's clicked twice in a row).
  function scrollToRik(ti, si, ri){
    const el = document.getElementById(`rik-${ti}-${si}-${ri}`);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.remove('match-highlight');
      void el.offsetWidth; // force a reflow so the animation restarts
      el.classList.add('match-highlight');
      highlightSidebarRik(ti, si, ri);
    }
  }

  // Synchronizes the sidebar tree's "current" state with a given r̥k:
  // marks its link as current, opens its ancestor section/text groups,
  // and auto-collapses sibling groups/sections so the tree doesn't grow
  // unboundedly as the user navigates around.
  function highlightSidebarRik(ti, si, ri){
    document.querySelectorAll('.rik-link.current').forEach(el => el.classList.remove('current'));
    document.querySelectorAll('.text-toggle.active-text').forEach(el => el.classList.remove('active-text'));
    document.querySelectorAll('.section-item.active-section').forEach(el => el.classList.remove('active-section'));
    const btn = document.querySelector(`.rik-link[data-text-idx="${ti}"][data-sec-idx="${si}"][data-rik-idx="${ri}"]`);
    if(btn){
      btn.classList.add('current');
      const secItem = btn.closest('.section-item');
      const group = btn.closest('.text-group');

      // Collapse every other top-level text group...
      document.querySelectorAll('.text-group').forEach(g => {
        if(g !== group) g.classList.remove('open');
      });
      // ...and every other section within the group we're navigating into.
      if(group){
        group.querySelectorAll('.section-item').forEach(s => {
          if(s !== secItem) s.classList.remove('open');
        });
      }

      if(secItem) secItem.classList.add('open', 'active-section');
      if(group){
        group.classList.add('open');
        group.querySelector(':scope > .text-toggle')?.classList.add('active-text');
      }
      btn.scrollIntoView({block:'nearest'});
    }
  }

  /* ============================================================
     SIDEBAR SHOW/HIDE
     On desktop the sidebar toggle just slides it off-canvas (see
     .sidebar.collapsed in CSS, which pushes it out via negative
     margin, shifting the main content over). On mobile the same
     class instead drives a fixed-position slide-in drawer with a
     dark scrim overlay behind it.
     ============================================================ */
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  document.getElementById('toggleSidebar').addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    if(window.innerWidth <= 720){
      overlay.classList.toggle('show', !sidebar.classList.contains('collapsed'));
    }
  });
  overlay.addEventListener('click', closeSidebarMobile);
  function closeSidebarMobile(){
    sidebar.classList.add('collapsed');
    overlay.classList.remove('show');
  }
  // Start collapsed on mobile so the reader content is visible immediately.
  if(window.innerWidth <= 720){ sidebar.classList.add('collapsed'); }

  /* ---------------- sidebar expand/collapse all buttons ---------------- */
  document.getElementById('expandAll').addEventListener('click', () => {
    document.querySelectorAll('.text-group').forEach(g => g.classList.add('open'));
    document.querySelectorAll('.section-item').forEach(s => s.classList.add('open'));
  });
  document.getElementById('collapseAll').addEventListener('click', () => {
    document.querySelectorAll('.text-group').forEach(g => g.classList.remove('open'));
    document.querySelectorAll('.section-item').forEach(s => s.classList.remove('open'));
  });

  /* ============================================================
     SIDEBAR FILTER
     A lightweight, client-side substring filter over the *tree
     labels only* (not verse text — that's what the global search
     below is for). It just shows/hides existing tree DOM nodes
     rather than rebuilding them, and auto-expands groups/sections
     that contain a match so results are visible without extra clicks.
     ============================================================ */
  const sidebarFilterInput = document.getElementById('sidebarFilter');
  const sidebarFilterClear = document.getElementById('sidebarFilterClear');
  let sidebarEmptyMsg = null;

  function applySidebarFilter(qRaw){
    const q = qRaw.trim().toLowerCase();
    sidebarFilterClear.classList.toggle('show', !!q);
    let anyMatch = false;
    document.querySelectorAll('.text-group').forEach(group => {
      const groupLabel = group.querySelector(':scope > .text-toggle .label').textContent.toLowerCase();
      let groupHasMatch = false;
      group.querySelectorAll('.section-item').forEach(secItem => {
        let secHasMatch = false;
        secItem.querySelectorAll('.rik-link').forEach(link => {
          const match = !q || link.textContent.toLowerCase().includes(q);
          link.style.display = match ? '' : 'none';
          if(match) secHasMatch = true;
        });
        const secLabel = secItem.querySelector('.section-toggle .label').textContent.toLowerCase();
        const secMatch = secHasMatch || !q || secLabel.includes(q) || groupLabel.includes(q);
        secItem.style.display = secMatch ? '' : 'none';
        if(secMatch) groupHasMatch = true;
        if(q && secMatch) secItem.classList.add('open'); else if(!q) secItem.classList.remove('open');
      });
      group.style.display = groupHasMatch || !q ? '' : 'none';
      if(groupHasMatch) anyMatch = true;
      if(q && groupHasMatch) group.classList.add('open'); else if(!q) group.classList.remove('open');
    });

    if(q && !anyMatch){
      if(!sidebarEmptyMsg){
        sidebarEmptyMsg = document.createElement('div');
        sidebarEmptyMsg.className = 'sidebar-empty';
        sidebarEmptyMsg.textContent = 'No sections or r̥ks match your filter.';
        treeRoot.appendChild(sidebarEmptyMsg);
      }
    } else if(sidebarEmptyMsg){
      sidebarEmptyMsg.remove();
      sidebarEmptyMsg = null;
    }
  }
  sidebarFilterInput.addEventListener('input', (e) => applySidebarFilter(e.target.value));
  sidebarFilterClear.addEventListener('click', () => {
    sidebarFilterInput.value = '';
    applySidebarFilter('');
    sidebarFilterInput.focus();
  });

  /* ============================================================
     GLOBAL CONTENT SEARCH
     A from-scratch, in-memory search over every r̥k and sāma-gāna's
     text fields. Rather than a full-text/inverted index, this does a
     simple weighted linear scan (fine at this data scale) with three
     notable features:
       1. Multi-term queries — every term must match somewhere in an
          entry (fields OR any of its sāma-gānas) for it to count.
       2. Quoted phrases — `"agnim ile"` is treated as one term.
       3. Diacritic-insensitive fuzzy matching — Sanskrit combining
          marks (svara/accent marks) are allowed to appear between
          the characters you typed, so searching without diacritics
          still matches accented text (see buildFuzzyRegex).
     ============================================================ */
  const globalSearch = document.getElementById('globalSearch');
  const clearSearch = document.getElementById('clearSearch');
  let searchIndex = []; // flat list of {ti, si, ri, r, fields, sgFields, ...} built once from DATA

  // Escapes a single character for safe use inside a RegExp.
  function escapeRegexChar(ch){
    return ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // Builds a regex that matches `term` even if Unicode combining marks
  // (e.g. Vedic svara accents, which are separate codepoints) are
  // interleaved between its characters in the source text. This lets a
  // plain, unaccented search term still match accented Sanskrit text.
  // Falls back to a literal (non-Unicode) regex if the environment
  // doesn't support the `u` flag's \p{M} property escape.
  function buildFuzzyRegex(term){
    const chars = Array.from(term);
    const pattern = chars.map(escapeRegexChar).join('\\p{M}*');
    try{ return new RegExp(pattern, 'giu'); }
    catch(e){ return new RegExp(chars.map(escapeRegexChar).join(''), 'gi'); }
  }

  // Splits a raw search query into individual terms, honoring
  // "double-quoted phrases" as a single term.
  function splitTerms(q){
    const terms = [];
    const re = /"([^"]+)"|(\S+)/g;
    let m;
    while((m = re.exec(q))){
      const t = (m[1] || m[2] || '').trim();
      if(t) terms.push(t);
    }
    return terms;
  }

  // Relative importance of each field when a term matches it — used
  // to rank results (e.g. matching a rishi/devatā name ranks higher
  // than matching a word buried in the pada-pāṭha).
  const FIELD_WEIGHT = {
    number: 200, rishi: 80, devata: 80, chandas: 70, ref: 60,
    samhita: 50, notes: 40, pada: 35, sg_text: 25, sg_notes: 20
  };

  // Flattens DATA into `searchIndex`: one entry per r̥k, with its
  // searchable fields pre-extracted (and the same for each of its
  // sāma-gānas), so scoring doesn't need to re-derive them per query.
  function buildSearchIndex(){
    searchIndex = [];
    DATA.forEach((text, ti) => {
      text.sections.forEach((sec, si) => {
        sec.riks.forEach((r, ri) => {
          const fields = {
            number: [r.rik_no, r.global_no, r.ref].filter(Boolean).map(String).join(' '),
            rishi: r.rishi || '',
            chandas: r.chandas || '',
            devata: r.devata || '',
            ref: r.ref || '',
            samhita: r.samhita || '',
            pada: r.pada || '',
            notes: r.notes || ''
          };
          const sgFields = (r.samaganas||[]).map(sg => ({
            sg,
            number: [sg.no, sg.global_no, sg.ref].filter(Boolean).map(String).join(' '),
            rishi: sg.rishi || '', chandas: sg.chandas || '', devata: sg.devata || '',
            sg_text: sg.text || '', sg_notes: sg.notes || ''
          }));
          searchIndex.push({ti, si, ri, r, fields, sgFields, textTitle: text.title, secLabel: sec.label});
        });
      });
    });
  }

  // Scores a single searchIndex entry (one r̥k + its sāma-gānas)
  // against the query's terms. ALL terms must match somewhere
  // (in the r̥k's own fields, or in any one of its sāma-gānas) or the
  // entry is rejected (returns null) — this is an AND across terms.
  // Returns { score, matchedSamaganaIdx } where matchedSamaganaIdx is
  // the set of sāma-gāna indices that directly matched at least one
  // term, used later to highlight/dim individual sāma-gāna cards.
  function scoreEntry(entry, terms){
    let total = 0;
    const matchedSamaganaIdx = new Set();
    for(const term of terms){
      const re = buildFuzzyRegex(term);
      let bestWeight = 0; // highest-weighted field this term matched in, for this entry
      // Check the r̥k's own fields (samhita text, pada, rishi, etc.)
      for(const key of Object.keys(entry.fields)){
        re.lastIndex = 0; // reset regex state between .test() calls (global flag keeps lastIndex)
        if(entry.fields[key] && re.test(entry.fields[key])){
          bestWeight = Math.max(bestWeight, FIELD_WEIGHT[key] || 10);
        }
      }
      // Also check each attached sāma-gāna's fields, tracking which
      // ones matched so they can be visually flagged later.
      entry.sgFields.forEach((sgf, idx) => {
        for(const key of ['number','rishi','chandas','devata','sg_text','sg_notes']){
          re.lastIndex = 0;
          const val = sgf[key];
          if(val && re.test(val)){
            const w = key === 'sg_text' ? FIELD_WEIGHT.sg_text
                    : key === 'sg_notes' ? FIELD_WEIGHT.sg_notes
                    : key === 'number' ? FIELD_WEIGHT.number
                    : FIELD_WEIGHT[key] || 40;
            bestWeight = Math.max(bestWeight, w);
            matchedSamaganaIdx.add(idx);
          }
        }
      });
      // This term matched nothing anywhere in the entry — the whole
      // entry fails the AND condition, so bail out immediately.
      if(bestWeight === 0) return null;
      total += bestWeight;
    }
    return {score: total, matchedSamaganaIdx};
  }

  // Wraps every substring of `str` that matches any of `terms` in
  // <mark> tags (merging overlapping/adjacent matches so nested
  // <mark>s never occur), for rendering search-result highlights.
  function highlightMatches(str, terms){
    if(!str || !terms.length) return escapeHtml(str);
    const ranges = [];
    terms.forEach(term => {
      const re = buildFuzzyRegex(term);
      let m;
      while((m = re.exec(str))){
        if(m[0].length === 0){ re.lastIndex++; continue; }
        ranges.push([m.index, m.index + m[0].length]);
        if(re.lastIndex > str.length) break;
      }
    });
    if(!ranges.length) return escapeHtml(str);
    // Sort by start position, then merge any overlapping/touching
    // ranges so overlapping term matches don't produce nested <mark>s.
    ranges.sort((a,b)=>a[0]-b[0]);
    const merged = [ranges[0]];
    for(let i=1;i<ranges.length;i++){
      const last = merged[merged.length-1];
      if(ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
      else merged.push(ranges[i]);
    }
    let out = '', cursor = 0;
    merged.forEach(([s,e]) => {
      out += escapeHtml(str.slice(cursor, s));
      out += '<mark>' + escapeHtml(str.slice(s, e)) + '</mark>';
      cursor = e;
    });
    out += escapeHtml(str.slice(cursor));
    return out;
  }

  // Runs a query against searchIndex and re-renders the content pane
  // with matching r̥ks (grouped by section, highest score first),
  // or restores the full, unfiltered view when the query is empty.
  function runGlobalSearch(qRaw){
    const q = qRaw.trim();
    clearSearch.classList.toggle('show', !!q);
    if(!q){
      renderAll();
      document.getElementById('crumb').textContent = '';
      return;
    }
    const terms = splitTerms(q);
    if(!terms.length){ renderAll(); return; }

    // Score every indexed r̥k; keep only those where every term matched.
    const scored = [];
    for(const entry of searchIndex){
      const res = scoreEntry(entry, terms);
      if(res) scored.push({entry, ...res});
    }
    // Best matches first; ties broken by canonical document order.
    scored.sort((a,b) => b.score - a.score || a.entry.ti-b.entry.ti || a.entry.si-b.entry.si || a.entry.ri-b.entry.ri);

    const totalSamaganaMatches = scored.reduce((a,s)=>a + (s.matchedSamaganaIdx.size || 0), 0);
    let html = `<div class="search-results-note">Found <b>${scored.length}</b> matching r̥k${scored.length===1?'':'s'}`
      + (totalSamaganaMatches ? ` (<b>${totalSamaganaMatches}</b> sāma-gāna${totalSamaganaMatches===1?'':'s'} directly matched)` : '')
      + ` for "<b>${escapeHtml(q)}</b>"</div>`;

    if(!scored.length){
      html += `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        <p>No verses match your search. Try fewer or different terms — accents/svara marks are ignored automatically.</p>
      </div>`;
    } else {
      let lastKey = ''; // tracks the last (text,section) pair rendered, to insert a heading whenever it changes
      // Cap at 400 results — plenty for any realistic query, and keeps
      // the DOM/render cost bounded for very broad terms.
      scored.slice(0, 400).forEach(({entry, matchedSamaganaIdx}) => {
        const meta = TEXT_META[DATA[entry.ti].key] || {translit:entry.textTitle};
        const key = entry.ti+'-'+entry.si;
        if(key !== lastKey){
          html += `<div class="section-heading" style="margin-top:26px;"><h3 style="font-size:13px;">${escapeHtml(meta.translit)} — ${escapeHtml(entry.secLabel)}</h3><div class="rule"></div></div>`;
          lastKey = key;
        }
        let rikHtml = renderRik(DATA[entry.ti], entry.ti, entry.si, entry.r, entry.ri, {terms, matchedSamaganaIdx});
        html += rikHtml;
      });
    }
    contentInner.innerHTML = html;
    document.getElementById('crumb').innerHTML = `Search: "<b>${escapeHtml(q)}</b>" · ${scored.length} result${scored.length===1?'':'s'}`;
  }

  // Debounce keystrokes (160ms) so search doesn't re-score+re-render
  // on every single character while the user is still typing.
  let searchTimer;
  globalSearch.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const val = e.target.value;
    searchTimer = setTimeout(() => runGlobalSearch(val), 160);
  });
  clearSearch.addEventListener('click', () => {
    globalSearch.value = '';
    runGlobalSearch('');
    globalSearch.focus();
  });

  /* ============================================================
     TEXT ZOOM
     A simple multiplier (0.6x–2x) applied via the `--zoom` CSS
     custom property, which every Sanskrit-text font-size in the
     stylesheet is expressed as `calc(Npx * var(--zoom, 1))`.
     ============================================================ */
  function applyZoom(){
    document.documentElement.style.setProperty('--zoom', zoom.toFixed(2));
    document.getElementById('zoomVal').textContent = Math.round(zoom*100) + '%';
  }
  document.getElementById('zoomIn').addEventListener('click', () => { zoom = Math.min(2, zoom + 0.1); applyZoom(); });
  document.getElementById('zoomOut').addEventListener('click', () => { zoom = Math.max(0.6, zoom - 0.1); applyZoom(); });

  /* ============================================================
     SCROLL SPY
     As the user scrolls the content pane, figure out which r̥k is
     currently at the top of the viewport and:
       1. update the breadcrumb in the topbar, and
       2. sync the sidebar tree's open/current state to match —
          so the sidebar always reflects "where you are" even when
          navigation happens purely by scrolling (not clicking).
     Skipped entirely while a search is active, since search results
     aren't in canonical document order.
     ============================================================ */
  const jumpTop = document.getElementById('jumpTop');
  contentEl.addEventListener('scroll', () => {
    jumpTop.classList.toggle('show', contentEl.scrollTop > 500);
    if(globalSearch.value.trim()) return; // scroll-spy only applies to the unfiltered view
    const cards = contentInner.querySelectorAll('.rik-card');
    let currentTextIdx = 0, currentSecIdx = 0, currentRikIdx = 0, found=false;
    // Walk cards top-to-bottom; the last one whose top has scrolled
    // past the topbar (140px) is the "current" one. Cards are in
    // document order, so we can stop at the first one still below it.
    for(const card of cards){
      const rect = card.getBoundingClientRect();
      if(rect.top <= 140){
        currentTextIdx = +card.dataset.text;
        currentSecIdx = +card.dataset.sec;
        currentRikIdx = +card.dataset.rik;
        found = true;
      } else break;
    }
    if(found){
      const text = DATA[currentTextIdx];
      const meta = TEXT_META[text.key] || {translit:text.title};
      const sec = text.sections[currentSecIdx];
      document.getElementById('crumb').innerHTML = `<b>${escapeHtml(meta.translit)}</b> / ${escapeHtml(sec.label)}`;
      highlightSidebarRik(currentTextIdx, currentSecIdx, currentRikIdx);
    }
  });
  jumpTop.addEventListener('click', () => contentEl.scrollTo({top:0, behavior:'smooth'}));

  /* ============================================================
     INIT
     Entry point: fetches the dataset, then builds the sidebar tree,
     search index, and initial content render from it. Everything
     above this point only defines functions/listeners — nothing
     runs against real data until this resolves.
     ============================================================ */
  async function init(){
    try{
      // Data lives alongside this file at data/prakritaranyakagana-grantha.json,
      // fetched fresh (no-cache) so edits to the JSON are picked up on reload.
      const res = await fetch('data/prakritaranyakagana-grantha.json', {cache:'no-cache'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      DATA = await res.json();
    }catch(err){
      // Most common cause: opened via file:// (fetch is blocked) or the
      // JSON simply isn't deployed alongside this HTML — show guidance.
      contentInner.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p><b>Could not load data.json.</b><br>${escapeHtml(err.message)}<br><br>
        Make sure <code>data/prakritaranyakagana-grantha.json</code> sits in a <code>data/</code> folder next to <code>index.html</code>
        and this page is served over http(s) (opening the file directly via <code>file://</code> blocks the fetch
        in most browsers — run a local server, e.g. <code>npx serve</code>, or deploy to Vercel).</p>
      </div>`;
      return;
    }
    // Precompute global totals once, used throughout for "№N of TOTAL" badges.
    TOTAL_RIKS = DATA.reduce((a,t)=>a+t.sections.reduce((b,s)=>b+s.riks.length,0),0);
    TOTAL_SAMANS = DATA.reduce((a,t)=>a+t.sections.reduce((b,s)=>b+s.riks.reduce((c,r)=>c+r.samaganas.length,0),0),0);
    buildTree();         // sidebar navigation
    buildSearchIndex();  // flat index for global search
    renderAll();         // main content pane
    applyZoom();         // sync the zoom % label / --zoom var with initial `zoom` value
    document.querySelectorAll('.text-group')[0]?.classList.add('open'); // open the first text by default
    document.getElementById('sidebarFoot').innerHTML =
      `<span><b>${DATA.length}</b> texts</span><span><b>${TOTAL_RIKS}</b> r̥ks</span><span><b>${TOTAL_SAMANS}</b> sāma-gānas</span>`;

    // If we arrived here from the landing page's universal search
    // (index.html?q=...), pick up the query and run it immediately.
    const params = new URLSearchParams(location.search);
    const q = params.get('q');
    if(q){
      globalSearch.value = q;
      runGlobalSearch(q);
    }
  }
  contentInner.innerHTML = `<div class="empty-state"><p>Loading Sāmaveda …</p></div>`;
  init();
</script>
</body>
</html>
